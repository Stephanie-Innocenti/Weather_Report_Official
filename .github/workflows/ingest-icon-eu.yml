name: ingest-icon-eu

on:
  schedule:
    # ICON-EU: run 00/06/12/18 UTC, disponibili dopo circa 4 ore. Job idempotente.
    - cron: "30 4-7,10-13,16-19,22,23,0,1 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "latest oppure YYYYMMDDHH"
        default: "latest"
      force:
        description: "Rigenera anche se esiste"
        type: boolean
        default: false
      vars:
        description: "Solo alcune variabili, es. z500,t850 (vuoto = tutte)"
        default: ""
      steps_max:
        description: "Limita gli step per un test veloce, es. 12 (vuoto = tutti)"
        default: ""

concurrency:
  group: ingest-icon-eu
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Librerie di sistema (eccodes)
        run: |
          for attempt in 1 2 3; do
            echo "Tentativo $attempt/3: installazione di libeccodes-dev"
            if sudo apt-get -o Acquire::Retries=3 update &&
               sudo apt-get -o Acquire::Retries=3 install -y libeccodes-dev; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Installazione non riuscita; nuovo tentativo tra $((attempt * 15)) secondi."
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::Impossibile installare libeccodes-dev dopo 3 tentativi."
          exit 1

      - name: Cache Natural Earth (coste e confini di cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      - name: Installa pipeline
        run: pip install -e pipeline

      - name: Ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN: ${{ inputs.run || 'latest' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          VARS: ${{ inputs.vars && format('--vars {0}', inputs.vars) || '' }}
          STEPS: ${{ inputs.steps_max && format('--steps-max {0}', inputs.steps_max) || '' }}
        run: wr ingest --model icon-eu --run "$RUN" $FORCE $VARS $STEPS
