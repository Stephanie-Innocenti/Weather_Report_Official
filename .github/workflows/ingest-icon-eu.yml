name: ingest-icon-eu

on:
  schedule:
    # I run completi sono disponibili circa 4 ore dopo l'inizializzazione; un job per run.
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "latest oppure YYYYMMDDHH"
        default: "latest"
      force:
        description: "Rigenera anche se esiste"
        type: boolean
        default: true
      vars:
        description: "Variabili da rigenerare (predefinito: t850; vuoto = tutte)"
        default: "t850"
      steps_max:
        description: "Limita gli step per un test veloce, es. 12 (vuoto = tutti)"
        default: ""

concurrency:
  group: ingest-icon-eu
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Cache Natural Earth (coste e confini di cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      - name: Installa pipeline
        run: pip install -e pipeline

      - name: Ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN: ${{ inputs.run || 'latest' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          VARS: ${{ inputs.vars && format('--vars {0}', inputs.vars) || '' }}
          STEPS: ${{ inputs.steps_max && format('--steps-max {0}', inputs.steps_max) || '' }}
        run: |
          if [ "$RUN" = "latest" ] && [ -z "$FORCE" ] && [ -z "$VARS" ] && [ -z "$STEPS" ]; then
            RUNS="$(python -c 'import json; from wr_pipeline import config, naming; from wr_pipeline.publish.storage import get_store; from wr_pipeline.sources.dwd_icon import available_runs; cfg=config.load("models")["icon-eu"]; raw=get_store(None).get(naming.LATEST_KEY); latest=json.loads(raw).get("models", {}).get("icon-eu", {}).get("run", "") if raw else ""; print(" ".join(naming.run_id(run) for run in available_runs(cfg["steps"]["stop"], cfg["params"]["t2m"], 4) if naming.run_id(run) > latest))')"
            for candidate in $RUNS; do
              wr ingest --model icon-eu --run "$candidate"
            done
          else
            wr ingest --model icon-eu --run "$RUN" $FORCE $VARS $STEPS
          fi
