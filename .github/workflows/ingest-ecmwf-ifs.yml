name: ingest-ecmwf-ifs

on:
  schedule:
    # Il run 00 arriva completo circa alle 06:27 UTC; il run 12 circa alle 18:27 UTC.
    - cron: "0 7,19 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "latest oppure YYYYMMDDHH"
        default: "latest"
      force:
        description: "Rigenera anche se esiste"
        type: boolean
        default: false
      vars:
        description: "Variabili da rigenerare (vuoto = tutte; es. t850)"
        default: ""
      steps_max:
        description: "Limita gli step per un test veloce, es. 12 (vuoto = tutti)"
        default: ""

concurrency:
  group: ingest-ecmwf-ifs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Cache Natural Earth (coste e confini di cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      - name: Installa pipeline
        run: pip install -e pipeline

      - name: Ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN: ${{ inputs.run || 'latest' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          VARS: ${{ inputs.vars && format('--vars {0}', inputs.vars) || '' }}
          STEPS: ${{ inputs.steps_max && format('--steps-max {0}', inputs.steps_max) || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            RUNS="$(python -c 'import json; from wr_pipeline import config, naming; from wr_pipeline.publish.storage import get_store; from wr_pipeline.sources.ecmwf import available_runs; cfg=config.load("models")["ecmwf-ifs"]; spec=config.param_spec(cfg["params"]["t2m"]); raw=get_store(None).get(naming.LATEST_KEY); latest=json.loads(raw).get("models", {}).get("ecmwf-ifs", {}).get("run", "") if raw else ""; print(" ".join(naming.run_id(run) for run in available_runs(cfg, cfg["steps"]["stop"], spec, 4) if naming.run_id(run) > latest))')"
            for candidate in $RUNS; do
              wr ingest --model ecmwf-ifs --run "$candidate"
            done
          else
            for attempt in 1 2 3 4; do
              if wr ingest --model ecmwf-ifs --run "$RUN" $FORCE $VARS $STEPS; then
                exit 0
              fi
              if [ "$attempt" -lt 4 ]; then
                echo "Run ECMWF non ancora pronto; nuovo tentativo tra 10 minuti ($attempt/4)"
                sleep 600
              fi
            done
            exit 1
          fi
