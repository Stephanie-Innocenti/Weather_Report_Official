name: ingest-ecmwf-ifs

on:
  schedule:
    # I run 00/12 UTC sono disponibili dopo circa 7-9 ore: si prova piu' volte, il job e' idempotente
    - cron: "20 7-10,19-22 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "latest oppure YYYYMMDDHH"
        default: "latest"
      force:
        description: "Rigenera anche se esiste"
        type: boolean
        default: false
      vars:
        description: "Solo alcune variabili, es. z500,t850 (vuoto = tutte)"
        default: ""
      steps_max:
        description: "Limita gli step per un test veloce, es. 12 (vuoto = tutti)"
        default: ""

concurrency:
  group: ingest-ecmwf-ifs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Librerie di sistema (eccodes)
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Cache Natural Earth (coste e confini di cartopy)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-v1

      - name: Installa pipeline
        run: pip install -e pipeline

      - name: Ingest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN: ${{ inputs.run || 'latest' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          VARS: ${{ inputs.vars && format('--vars {0}', inputs.vars) || '' }}
          STEPS: ${{ inputs.steps_max && format('--steps-max {0}', inputs.steps_max) || '' }}
        run: wr ingest --model ecmwf-ifs --run "$RUN" $FORCE $VARS $STEPS
