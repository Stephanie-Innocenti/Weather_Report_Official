# scale/offset: valore_finale = valore_grib * scale + offset
t2m:
  label: "Temperatura a 2 m"
  unit: "°C"
  scale: 1
  offset: -273.15
  kind: fill
  stops: [[-30,"#3a0a5c"],[-20,"#5a2ca0"],[-12,"#2f55d4"],[-6,"#3f93f0"],[-0.1,"#a9ddf5"],[0.1,"#b8e8a6"],[6,"#79cf6c"],[12,"#f4e65a"],[20,"#f7a53b"],[28,"#e2432b"],[36,"#a1122a"],[45,"#5a0a2c"]]
  levels: [-30, 45, 3]               # min, max, passo
  extend: both
mslp:
  label: "Pressione al livello del mare"
  unit: "hPa"
  scale: 0.01
  offset: 0
  kind: contour
  levels: [940, 1060, 4]
tp-acc:
  label: "Precipitazione cumulata dal run"
  unit: "mm"
  scale: 1000
  offset: 0
  kind: fill
  levels_list: [0.1, 1, 2, 5, 10, 20, 30, 50, 75, 100, 150, 200]
  colors: ["#b7e3f5", "#8ccdf0", "#5aaee8", "#2f86d9", "#36b37e", "#8fd14f", "#f2e03d", "#f5a623", "#e8452c", "#b3122f", "#8c2d8f", "#4b1a63"]
  extend: max
  mask_below: 0.1
  skip_step0: true
z500:
  label: "Geopotenziale a 500 hPa"
  unit: "dam"
  scale: 0.1                         # gpm -> dam
  offset: 0
  kind: fill
  stops: [[480,"#2a0b5e"],[504,"#3b3fc4"],[516,"#3d8be8"],[528,"#4fc3e8"],[540,"#66d1a4"],[552,"#a6dd6a"],[558,"#e9e25b"],[570,"#f6b23c"],[582,"#ee6a2e"],[592,"#c8262f"],[600,"#7a0f3b"]]
  levels: [480, 600, 6]
  lines: [480, 600, 6]               # isoipse ogni 6 dam
  extend: both
z850:
  label: "Geopotenziale a 850 hPa"
  unit: "dam"
  scale: 0.1
  offset: 0
  kind: fill
  stops: [[90,"#2a0b5e"],[110,"#3b3fc4"],[120,"#3d8be8"],[130,"#4fc3e8"],[138,"#66d1a4"],[146,"#a6dd6a"],[152,"#e9e25b"],[160,"#f6b23c"],[168,"#ee6a2e"],[174,"#c8262f"],[178,"#7a0f3b"]]
  levels: [90, 178, 4]
  lines: [90, 178, 4]
  extend: both
t850:
  label: "Temperatura a 850 hPa"
  unit: "°C"
  scale: 1
  offset: -273.15
  kind: fill
  stops: [[-30,"#3a0a5c"],[-22,"#5a2ca0"],[-14,"#2f55d4"],[-7,"#3f93f0"],[-0.1,"#a9ddf5"],[0.1,"#b8e8a6"],[6,"#79cf6c"],[12,"#f4e65a"],[18,"#f7a53b"],[24,"#e2432b"],[30,"#a1122a"]]
  levels: [-30, 30, 3]
  extend: both
wind10m:
  label: "Vento a 10 m"
  unit: "km/h"
  scale: 1
  offset: 0
  kind: vector                       # u/v in m/s -> immagine in km/h + JSON per la mappa live
  levels_list: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120]
  colors: ["#e3f1fa", "#bfe0f4", "#8fcdea", "#6fd0a6", "#9bd96a", "#e9e05a", "#f6b23c", "#ee6a2e", "#c8262f", "#8c2d8f", "#4b1a63"]
  extend: max
  json_regions: [eu]
  json_step_deg: 0.5
