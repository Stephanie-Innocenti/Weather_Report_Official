# Un modello = una voce. Nuovo modello: nuova voce + nuovo file in src/wr_pipeline/sources/
# params: variabile nostra -> parametro del modello. Stringa oppure dict (levtype, levelist, level, short).
ecmwf-ifs:
  label: "ECMWF IFS"
  enabled: true
  source: ecmwf_opendata
  client: { model: ifs, resol: 0p25 }
  sources: [google, azure, ecmwf, aws]   # provate in ordine
  retries: 3
  retry_after: 20
  stream: oper
  runs: [0, 12]                      # 06/18 UTC hanno meno step: rimandati
  steps: { start: 0, stop: 144, every: 3 }
  params:
    t2m: { param: "2t" }
    mslp: { param: "msl" }
    tp-acc: { param: "tp" }
    z500: { param: "gh", levtype: pl, levelist: 500 }
    z850: { param: "gh", levtype: pl, levelist: 850 }
    t850: { param: "t", levtype: pl, levelist: 850 }
  regions: [eu, it]
  attribution: "Adapted from ECMWF IFS Open Data, CC BY 4.0 - Weather Report"

gfs:
  label: "GFS"
  enabled: true
  source: noaa_gfs
  runs: [0, 6, 12, 18]
  steps: { start: 0, stop: 144, every: 3 }
  params:                            # short = nome cfgrib per leggere il GRIB
    t2m: { param: "TMP", level: "2 m above ground", short: "2t" }
    mslp: { param: "PRMSL", level: "mean sea level", short: "prmsl" }
    z500: { param: "HGT", level: "500 mb", short: "gh" }
    z850: { param: "HGT", level: "850 mb", short: "gh" }
    t850: { param: "TMP", level: "850 mb", short: "t" }
  regions: [eu, it]
  attribution: "Adapted from NOAA GFS (public domain) - Weather Report"

icon-eu:
  label: "ICON-EU (DWD)"
  enabled: true
  source: dwd_icon
  runs: [0, 6, 12, 18]
  steps: { start: 0, stop: 120, every: 3 }
  params:                            # short: ~ = nessun filtro (un solo parametro per file)
    t2m: { param: "T_2M", short: ~ }
    mslp: { param: "PMSL", short: ~ }
    tp-acc: { param: "TOT_PREC", scale: 1, short: ~ }                      # gia' in mm dall'inizio del run
    z500: { param: "FI", level: 500, scale: 0.0101972, short: ~ }          # m2/s2 -> dam: 1/(9.80665*10)
    z850: { param: "FI", level: 850, scale: 0.0101972, short: ~ }
    t850: { param: "T", level: 850, short: ~ }
  regions: [eu, it]                  # il dominio ICON-EU copre circa 29.5-70.5 N, 23.5 W-62.5 E
  attribution: "Datenbasis: Deutscher Wetterdienst (DWD), ICON-EU - adapted by Weather Report"
